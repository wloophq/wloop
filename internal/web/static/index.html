<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="build" content="{{build}}">
<meta name="link-scheme" content="{{scheme}}">
<title>{{name}} cockpit</title>
<link rel="icon" href="/static/favicon.svg?v={{build}}" type="image/svg+xml">
<link rel="stylesheet" href="/static/app.css?v={{build}}">
</head>
<body>
<header id="top">
  <input id="search" class="search" type="search" maxlength="200" autocomplete="off" spellcheck="false" aria-label="Filter the list" data-i18n-aria-label="Filter the list" aria-keyshortcuts="/" placeholder="Filter: text, where:, author:, wait:me, risk:high, tag:lang:go  ( / )" data-i18n-placeholder="Filter: text, where:, author:, wait:me, risk:high, tag:lang:go  ( / )" data-focus="top:search">
  <span id="sync" class="sync">connecting</span>
  <span id="notice" class="notice" role="status" aria-live="polite"></span>
</header>
<div id="warnings" class="warnings" role="alert" hidden></div>
<div id="update" class="update" role="status" hidden><span data-i18n="A new version is running.">A new version is running.</span> <button id="update-reload" type="button" class="act" data-focus="update:reload" data-i18n="Reload">Reload</button></div>
<main id="app">
  <nav id="rail" aria-label="Views" data-i18n-aria-label="Views">
    <div class="rail-mark"><span class="mark">{{name}}</span></div>
    <button id="omnibox-entry" type="button" class="find" aria-keyshortcuts="Meta+K" data-focus="rail:omnibox"></button>
    <ul id="views" class="views"></ul>
    <h2 class="rail-head" data-i18n="Waiting on">Waiting on</h2>
    <ul id="people" class="views people"></ul>
  </nav>
  <section id="list" aria-label="Pull requests" data-i18n-aria-label="Pull requests">
    <section id="explore" class="explore" aria-label="Explore pull requests" data-i18n-aria-label="Explore pull requests" hidden>
      <form id="explore-form" class="explore-form" role="search">
        <input id="explore-q" type="search" maxlength="256" autocomplete="off" spellcheck="false" data-focus="explore:q" aria-label="Pull request URL, owner/repo, a repository or login, @org/team or a search" data-i18n-aria-label="Pull request URL, owner/repo, a repository or login, @org/team or a search" placeholder="PR URL, owner/repo, repo, login, @org/team or a search" data-i18n-placeholder="PR URL, owner/repo, repo, login, @org/team or a search">
        <button id="explore-go" type="submit" class="act primary" data-focus="explore:go" data-i18n="Search">Search</button>
      </form>
      <div id="explore-chips" class="chips"></div>
      <p id="explore-status" class="explore-status" role="status" aria-live="polite"></p>
      <div id="explore-act" class="explore-act" hidden>
        <div id="explore-act-head" class="meta"></div>
        <textarea id="explore-guidance" rows="2" aria-label="Guidance" data-i18n-aria-label="Guidance" data-focus="explore:guidance" placeholder="Guidance for the action you pick (optional)" data-i18n-placeholder="Guidance for the action you pick (optional)"></textarea>
        <div id="explore-act-buttons" class="d-actions"></div>
      </div>
      <ol id="explore-results" class="cands" aria-label="Candidates" data-i18n-aria-label="Candidates"></ol>
    </section>
    <section id="plan" class="plan" aria-label="The workflows' plan" data-i18n-aria-label="The workflows' plan" hidden></section>
    <section id="dash" class="dash" aria-label="Backlog dashboard" data-i18n-aria-label="Backlog dashboard" hidden></section>
    <section id="home" class="home-screen" aria-label="Home" data-i18n-aria-label="Home" hidden></section>
    <section id="queue" class="queue-screen" aria-label="Decision queue" data-i18n-aria-label="Decision queue" hidden></section>
    <section id="tasks" class="tasks" hidden>
      <div id="tasks-head"></div>
      <div id="task-tools" class="tools" role="toolbar" aria-label="Filter, group and sort the tasks" data-i18n-aria-label="Filter, group and sort the tasks" hidden></div>
      <div id="tasks-body"></div>
    </section>
    <details id="list-box" class="list-box" open>
      <summary id="list-sum" class="list-sum"></summary>
      <div id="tools" class="tools" role="toolbar" aria-label="Filter, group and sort" data-i18n-aria-label="Filter, group and sort" hidden></div>
      <div id="table"></div>
      <div id="board" class="board" hidden></div>
      <ol id="activity" class="activity" aria-label="Recent activity" data-i18n-aria-label="Recent activity" hidden></ol>
      <p id="empty" class="empty" hidden></p>
    </details>
  </section>
  <div id="detail-resize" role="separator" aria-orientation="vertical" aria-label="Resize the detail panel" data-i18n-aria-label="Resize the detail panel" tabindex="0"></div>
  <aside id="detail" aria-label="Detail" data-i18n-aria-label="Detail" hidden></aside>
</main>
<script src="/static/vendor/echarts.min.js?v={{build}}"></script>
<script src="/static/i18n.js?v={{build}}"></script>
<script src="/static/markdown.js?v={{build}}"></script>
<script src="/static/row.js?v={{build}}"></script>
<script src="/static/dash.js?v={{build}}"></script>
<script src="/static/plugins.js?v={{build}}"></script>
<script src="/static/routes.js?v={{build}}"></script>
<script src="/static/panel.js?v={{build}}"></script>
<script src="/static/window.js?v={{build}}"></script>
<script src="/static/outbox.js?v={{build}}"></script>
<script src="/static/views.js?v={{build}}"></script>
<script src="/static/review.js?v={{build}}"></script>
<script src="/static/gate.js?v={{build}}"></script>
<script src="/static/timeline.js?v={{build}}"></script>
<script src="/static/task.js?v={{build}}"></script>
<script src="/static/detail.js?v={{build}}"></script>
<script src="/static/update.js?v={{build}}"></script>
<script src="/static/rail.js?v={{build}}"></script>
<script src="/static/home.js?v={{build}}"></script>
<script src="/static/queue.js?v={{build}}"></script>
<script src="/static/toolbar.js?v={{build}}"></script>
<script src="/static/app.js?v={{build}}"></script>
<script src="/static/omnibox.js?v={{build}}"></script>
<script src="/static/keys.js?v={{build}}"></script>
</body>
</html>
