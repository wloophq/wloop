#:schema ../intent.schema.json

label = "Ask author"
summary = "Ask the author one question"
workspace = "review"
session = { strategy = "new", title = "ask" }
shortcut = "Q"
start_line = "asking the author"
owner_only = false

[inputs.topic]
type = "text"
flag = "--topic"
help = "what to ask about"
max = 200
persist = true

[action]
surfaces = ["row", "detail", "tui", "cli"]
when = "row.open && !pr.mine"
note = "Ask {{.pr.author}} one question"

[headline]
resumed = "ask round on {{.pr.slug}}"
[[headline.new]]
line = "Ask the author of {{.pr.slug}} one question."

[record]
states = ["done", "asked", "failed"]
