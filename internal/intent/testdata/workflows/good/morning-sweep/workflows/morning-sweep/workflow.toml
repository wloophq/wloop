summary = "Remove finished workspaces every weekday morning"
provider = "workspace"
when = 'workspace.pr_state == "MERGED" && workspace.pendency == []'

[trigger]
schedule = "0 9 * * 1-5"

[[step]]
use = "workspace.remove"

[gates.approval]
mode = "delay"
window = "1d"
[[gates.approval.rule]]
when = 'workspace.untracked > 0'
mode = "wait"
