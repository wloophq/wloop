label = "Address"
summary = "Triage the reviews of a pull request you develop"
verb = "delegate"
key = "F"
workspace = "author"
drives_row = true
session = { strategy = "reuse_live", title = "triage" }
owner_only = true
profile = "address"
records = "!turn.needs_take_over"

[headline]
resumed = "address round on {{.PR.Slug}}"
[[headline.new]]
when = "inputs.take_over"
text = "Take over {{.PR.Slug}}."
[[headline.new]]
text = "Address round on {{.PR.Slug}}."

[inputs.take_over]
type   = "flag"
flag   = "--take-over"
help   = "takes it over first"
before = "take_over"

[inputs.self_review]
type = "flag"
flag = "--self-review"
help = "reviews the change first"
persist = true
by_hand_only = true

[[also_profiles]]
profile = "review"
when    = "inputs.self_review && !turn.needs_take_over"
round   = "first"
define  = "review-judgment"

[action]
enabled  = "pr.mine || row.adopted || row.author_workspace"
reason_off = "Not yours: take it over first"

[join]
differs_on = ["self_review"]

[record]
states    = ["done", "asked", "failed"]
artifacts = ["triage"]
history_artifact = "triage"
