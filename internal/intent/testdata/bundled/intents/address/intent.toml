label = "Address"
summary = "Triage the reviews of a pull request you develop"
verb = "delegate"
shortcut = "F"
role = "pr.address"
workspace = "author"
session = { strategy = "reuse_live", title = "triage" }
owner_only = true
profile = "address"

[headline]
resumed = "address round on {{.pr.slug}}"
[[headline.new]]
when = "inputs.take_over"
line = "Take over {{.pr.slug}}."
[[headline.new]]
line = "Address round on {{.pr.slug}}."

[inputs.take_over]
type   = "bool"
flag   = "--take-over"
help   = "takes it over first"
before = "take_over"

[inputs.self_review]
type = "bool"
flag = "--self-review"
help = "reviews the change first"
persist = true
by_hand_only = true

[[also_profile]]
profile = "review"
when    = "inputs.self_review && !turn.needs_take_over"
dims   = { stage = "first" }
define  = "review-judgment"

[action]
enabled  = "pr.mine || pr.adopted || row.author_workspace"
reason_off = "Not yours: take it over first"

[join]
differs_on = ["self_review"]

[record]
when = "!turn.needs_take_over"
states    = ["done", "asked", "failed"]
artifacts = ["triage"]
history_artifact = "triage"
