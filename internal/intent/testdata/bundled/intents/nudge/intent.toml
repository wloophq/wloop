label = "Nudge"
summary = "Ask whoever a pull request waits on for the next step"
key = "N"
workspace = "pr_else_main"
session = { strategy = "new", title = "nudge", close_when_done = true }
answerable = false
profile = "nudge"
prepare = "nudge.prepare"

[headline]
resumed = "nudge on {{.PR.Slug}}"
[[headline.new]]
text = "Nudge on {{.PR.Slug}}."

[inputs.situation]
type = "text"
from = "prepare"

[inputs.who]
type = "list"
from = "prepare"

[action]
enabled = 'pr.nudge.refusal == ""'
reason_off = "{{.pr.nudge.refusal}}"
confirm = "Nudge {{join .pr.nudge.who \", \"}} on {{.pr.slug}}?"

[record]
states = ["done", "failed"]
