label = "Review"
summary = "Review a pull request"
verb = "delegate"
shortcut = "V"
role = "pr.review"
workspace = "review"
session = { strategy = "reuse_live", title = "review" }
profile = "review"
dims = ["stage"]

[headline]
resumed = "review round on {{.pr.slug}}"
[[headline.new]]
line = "Review {{.pr.slug}}."

[action]
primary = "!row.question && !pr.mine"

[record]
when = '!turn.try'
states = ["done", "asked", "failed"]
artifacts = ["review-draft"]
outcome = ["verdict", "url"]
history_artifact = "review-draft"
