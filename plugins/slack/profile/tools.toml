# What the agent reads about each tool of the Slack plugin, one table per
# tool, in the form of the default profile's tools.toml. A user profile's
# plugins/slack/tools.toml replaces the keys it sets.

[slack_send_message]
description = "Post a message to Slack as the user, at once and without their approval. When it is unclear whether the user wants this message posted in their name, ask them first. An @handle, an @<user id> or an email in the text that names one person becomes a mention of them."

[slack_send_message.params]
"target" = "a message, by its ref (<conversation>/<ts>) or permalink, to reply in its thread; else #channel, channel id, @handle, email or user id"
"text" = "the message, in Markdown"
"thread" = "reply in the message's thread; defaults to true for a message, false otherwise"
"broadcast" = "also send a thread reply to the conversation"

[slack_send_message.answers]
refused = "slack_send_message refused: {{.Error}}."
bad_arguments = "Nothing was sent: the arguments are not an object with target and text{{with .Error}} ({{.}}){{end}}."
fix_these = """Nothing was sent; fix these and call slack_send_message again:
{{.Problems}}"""
not_logged_in = "not logged in to Slack; run \"{{.Command}} slack login\""
failed = "Slack send failed: {{.Error}}"
problem_target_required = "target: required"
problem_text_required = "text: required, not empty"
broadcast = "Nothing was sent: the text notifies a whole channel or group (<!channel>, <!here>, <!everyone> or a <!subteam^...> mention). Ask the user to post it themselves."
posted = """Posted to {{.Conversation}}{{with .Parent}} in the thread {{printf "%q" .}}{{end}}: {{if .Permalink}}{{.Permalink}}{{else}}no permalink ({{.Channel}}/{{.TS}}){{end}}

{{.Text}}"""

[slack_read]
description = "Read a Slack thread or conversation, rendered: a unit (slack:<key>), or the thread of a message ref (<conversation>/<ts>) or permalink. Stored messages come first; a channel thread not stored is read from Slack and not followed; direct messages only when tracked. Each message prints as [m<N> <conversation>/<ts>]: that ref is a target slack_react, slack_edit, slack_draft and slack_send_message take, and slack_read reads its thread; m<N> only numbers the messages of this read, as in \"reply to m<K>\"."

[slack_read.params]
"target" = "a unit (slack:<key>), a message ref (<conversation>/<ts>) or a message permalink"
"limit" = "how many messages to show, at most 200; the first message is always kept. Default 50"

[slack_read.answers]
refused = "slack_read refused: {{.Error}}."
bad_arguments = "Nothing was read: the arguments are not an object with target and an optional limit{{with .Error}} ({{.}}){{end}}."
fix_these = """Nothing was read; fix these and call slack_read again:
{{.Problems}}"""
not_logged_in = "not logged in to Slack; run \"{{.Command}} slack login\""
failed = "Slack read failed: {{.Error}}"
problem_target_required = "target: required"
problem_limit = "limit: an integer from 1 to {{.Max}}"
read = "{{.Text}}"

[slack_search]
description = "Search the Slack messages the user can read, newest first: one line per message, \"<permalink> · <author> · <time> · <first line>\", times in the user's time zone. Direct messages show only when tracked. Pass a permalink, or the ref a line without one prints, to slack_read to read its thread, or to slack_draft, slack_react, slack_edit or slack_send_message to act on it."

[slack_search.params]
"query" = "what to look for, as Slack's search box reads it"
"channel" = "only in this channel: #name or channel id"
"from" = "only by this person: @handle, user id or email"
"after" = "only after this day, YYYY-MM-DD, the day itself excluded"
"before" = "only before this day, YYYY-MM-DD, the day itself excluded"
"limit" = "how many messages to show, at most 100. Default 20"

[slack_search.answers]
refused = "slack_search refused: {{.Error}}."
bad_arguments = "Nothing was searched: the arguments are not an object with query, and channel, from, after, before and limit when needed{{with .Error}} ({{.}}){{end}}."
fix_these = """Nothing was searched; fix these and call slack_search again:
{{.Problems}}"""
not_logged_in = "not logged in to Slack; run \"{{.Command}} slack login\""
failed = "Slack search failed: {{.Error}}"
problem_query_required = "query: required, not empty"
problem_after = "after: a date, YYYY-MM-DD"
problem_before = "before: a date, YYYY-MM-DD"
problem_before_after = "before: a date after after"
problem_limit = "limit: an integer from 1 to {{.Max}}"
found = "{{.Text}}"

[slack_draft]
description = "Propose a Slack message, or a reaction, to be posted as the user once they approve it in the {{.Name}} Outbox. It posts nothing itself. Target a message, by its ref (<conversation>/<ts>) or permalink, to reply in its thread, even one your turn is not on. From a turn on a task, a #channel, channel id or user id target works too. Name people as @{slack:<user id>}; a typed <@<user id>>, an @handle or an email that names one person becomes that mention, any other mention, channel or special token posts as text, and a broadcast or group mention is refused."

[slack_draft.params]
"text" = "the message, in Markdown; empty for a reaction"
"kind" = "what the draft is; defaults to reply"
"target" = "where it posts: empty for the unit's thread, or on a direct message the thread of the newest message its items name (a reaction: the newest message an item started at); else a message ref (<conversation>/<ts>) or permalink, #channel, channel id or user id"
"items" = "the unit's items the draft answers; none outside the turn's Slack unit"
"items[]" = "an item id of the unit"
"reaction" = "the emoji name of a react draft, without colons"
"effects" = "what sending it does besides posting, such as unit.closed for a closing post; empty for none, and none outside the turn's Slack unit"
"effects[]" = "an effect name your intent lists in drafts.allowed_effects"

[slack_draft.answers]
refused = "slack_draft refused: {{.Error}}."
bad_arguments = "Nothing was drafted: the arguments are not an object with text, and kind, target, items, reaction and effects when needed{{with .Error}} ({{.}}){{end}}."
fix_these = """Nothing was drafted; fix these and call slack_draft again:
{{.Problems}}"""
not_logged_in = "not logged in to Slack; run \"{{.Command}} slack login\""
failed = "Nothing was drafted: {{.Error}}"
problem_kind = "kind: one of {{.Kinds}}"
problem_reaction_required = "reaction: required for a react draft"
problem_text_required = "text: required, not empty"
proposed = "Proposed draft {{.ID}} on {{.Unit}}: it will be posted to {{or .Where \"its conversation\"}} once the user, or their approval policy, approves it in the {{.Name}} Outbox; nothing was posted yet."

[slack_react]
description = "Add a reaction to a Slack message as the user, or remove one, at once and without their approval, such as swapping an hourglass for a check mark on a status reply. When it is unclear whether the user wants it, ask them first."

[slack_react.params]
"message" = "the message: its ref (<conversation>/<ts>), as slack_read and your turn print it, or its permalink"
"emoji" = "the emoji name, such as white_check_mark, with or without colons"
"remove" = "remove the user's reaction instead of adding it"

[slack_react.answers]
refused = "slack_react refused: {{.Error}}."
bad_arguments = "Nothing was changed: the arguments are not an object with message and emoji{{with .Error}} ({{.}}){{end}}."
fix_these = """Nothing was changed; fix these and call slack_react again:
{{.Problems}}"""
not_logged_in = "not logged in to Slack; run \"{{.Command}} slack login\""
failed = "Slack reaction failed: {{.Error}}"
problem_message = "message: required, a Slack message ref (<conversation>/<ts>) or permalink"
problem_emoji_required = "emoji: required, not empty"
reacted = "Reacted :{{.Emoji}}: to the message {{.Message}} in {{.Conversation}}{{with .Permalink}}: {{.}}{{end}}"
removed = "Removed :{{.Emoji}}: from the message {{.Message}} in {{.Conversation}}{{with .Permalink}}: {{.}}{{end}}"
already = "The message {{.Message}} already had :{{.Emoji}}: of the user; nothing changed{{with .Permalink}}: {{.}}{{end}}"
absent = "The message {{.Message}} had no :{{.Emoji}}: of the user; nothing changed{{with .Permalink}}: {{.}}{{end}}"

[slack_edit]
description = "Replace the text of one of the user's own Slack messages, at once and without their approval; the {{.Name}} Outbox keeps the text it replaced. It refuses a message someone else posted. When it is unclear whether the user wants the message changed, ask them first. An @handle, an @<user id> or an email that names one person becomes a mention of them."

[slack_edit.params]
"message" = "the user's message: its ref (<conversation>/<ts>), as slack_read and your turn print it, or its permalink"
"text" = "the message's new text, in Markdown, replacing the whole message"

[slack_edit.answers]
refused = "slack_edit refused: {{.Error}}."
bad_arguments = "Nothing was changed: the arguments are not an object with message and text{{with .Error}} ({{.}}){{end}}."
fix_these = """Nothing was changed; fix these and call slack_edit again:
{{.Problems}}"""
not_logged_in = "not logged in to Slack; run \"{{.Command}} slack login\""
failed = "Slack edit failed: {{.Error}}"
problem_message = "message: required, a Slack message ref (<conversation>/<ts>) or permalink"
problem_text_required = "text: required, not empty"
broadcast = "Nothing was changed: the text notifies a whole channel or group (<!channel>, <!here>, <!everyone> or a <!subteam^...> mention). Ask the user to edit it themselves."
edited = """Edited the message {{.Message}} in {{.Conversation}}{{with .Permalink}}: {{.}}{{end}}

{{.Text}}

It replaced:

{{.Replaced}}"""
