# What the agent reads about each tool of the Slack plugin, one table per
# tool, in the form of the default profile's tools.toml. A user profile's
# plugins/slack/tools.toml replaces the keys it sets.

[slack_post]
description = "Write a Slack post in the user's name: a message, a reaction or its removal (unreact), or an edit or deletion of one of the user's messages. With draft true, the default, it is a draft that waits for the user in {{.Name}}, where they review, edit and post it, unless one of their approval rules posts it. With draft false it is posted at once, as the user: set it only when the user told you, in this session, to post it. Target a message, by its ref (<conversation>/<ts>) or permalink, to reply in its thread, even one your turn is not on; broadcast decides whether the reply also shows in the conversation. A #channel, channel id, user id, @handle or email target works too. Name people as @{slack:<user id>}; a typed <@<user id>>, an @handle or an email that names one person becomes that mention, any other mention, channel or special token posts as text, and a broadcast or group mention is refused."

[slack_post.params]
"text" = "the message, or an edit's new text, in Markdown; empty for a reaction or a deletion"
"kind" = "what the post is; defaults to reply"
"target" = "where it posts: empty for the unit's thread, or on a direct message the thread of the newest message its items name (a reaction: the newest message an item started at); else a message ref (<conversation>/<ts>) or permalink, #channel, channel id, user id, @handle or email. An edit or a deletion names the user's message it changes, by its ref or permalink"
"items" = "the unit's items the post answers; none outside the turn's Slack unit"
"items[]" = "an item id of the unit"
"reaction" = "the emoji name of a react or unreact post, without colons"
"effects" = "what posting it does besides the post, such as unit.closed for a closing post; empty for none, and none outside the turn's Slack unit"
"effects[]" = "an effect name your intent lists in drafts.allowed_effects"
"broadcast" = "a reply in a thread: true to also post it to the conversation, false not to; left out, the user's default: on in a direct message, where a reply in an older thread does not show, and off in a channel. The user can turn it before posting a draft"
"payload" = "the kind's fields beside text; Slack's kinds have none, so leave it out or pass {}"
"basis" = "what the post was written against; Slack's kinds have none, so leave it out"
"draft" = "true, the default, makes a draft for the user; false posts it at once in the user's name, only when the user told you to"
"hold" = "with draft true: keep the draft waiting for the user even where one of their approval rules would post it, such as for a draft your question asks about"

[slack_post.answers]
refused = "slack_post refused: {{.Error}}."
bad_arguments = "Nothing was written: the arguments are not an object with text, and kind, target, items, reaction, effects, broadcast, draft and hold when needed{{with .Error}} ({{.}}){{end}}."
fix_these = """Nothing was written; fix these and call slack_post again:
{{.Problems}}"""
not_logged_in = "not logged in to Slack; run \"{{.Command}} slack login\""
failed = "Nothing was written: {{.Error}}"
problem_kind = "kind: one of {{.Kinds}}"
problem_reaction_required = "reaction: required for a react or unreact post"
problem_message = "target: required for an edit or a deletion, the ref (<conversation>/<ts>) or permalink of the user's message it changes"
problem_message_gone = "target: Slack holds no message there; it may already be deleted"
problem_message_not_yours = "target: the message is not the user's; an edit or a deletion changes only the user's own messages"
problem_text_required = "text: required, not empty"
problem_hold = "hold: only with draft true; a post with draft false waits for nobody"
drafted = "Drafted {{.ID}}{{with .Unit}} on {{.}}{{end}} for {{or .Where \"its conversation\"}}; nothing was posted. It waits for the user{{with .Link}} at {{.}}{{end}}, where they review, edit and post it."
approved = "Drafted {{.ID}}{{with .Unit}} on {{.}}{{end}}; one of the user's approval rules posts it to {{or .Where \"its conversation\"}} now."
dry_run = "Drafted {{.ID}}{{with .Unit}} on {{.}}{{end}} as a dry run: the user's approval stores drafts and never posts them, so it will not be posted to {{or .Where \"its conversation\"}}."
posting = "Posting {{.ID}} to {{or .Where \"its conversation\"}} now, in the user's name; draft_read shows its link once it is posted."
kept = "Nothing was posted: {{.Name}} posts at once only from a session the user drives, and this one runs a turn {{.Name}} sent, or {{.Name}} typed into it last. It is draft {{.ID}} for {{or .Where \"its conversation\"}}{{with .Link}}, at {{.}}{{end}}. Give the user the link and tell them: \"It is ready in {{.Name}}; post it from there, or tell me here to post it.\""

[slack_read]
description = "Read a Slack thread or conversation, rendered: a unit (slack:<key>), or the thread of a message ref (<conversation>/<ts>) or permalink. Stored messages come first; a channel thread not stored is read from Slack and not followed; direct messages only when tracked. Each message prints as [m<N> <conversation>/<ts>]: that ref is a target slack_post takes, and slack_read reads its thread; m<N> only numbers the messages of this read, as in \"reply to m<K>\"."

[slack_read.params]
"target" = "a unit (slack:<key>), a message ref (<conversation>/<ts>) or a message permalink"
"limit" = "how many messages to show, at most 200; the first message is always kept. Default 50"

[slack_read.answers]
refused = "slack_read refused: {{.Error}}."
bad_arguments = "Nothing was read: the arguments are not an object with target and an optional limit{{with .Error}} ({{.}}){{end}}."
fix_these = """Nothing was read; fix these and call slack_read again:
{{.Problems}}"""
not_logged_in = "not logged in to Slack; run \"{{.Command}} slack login\""
failed = "Slack read failed: {{.Error}}"
problem_target_required = "target: required"
problem_limit = "limit: an integer from 1 to {{.Max}}"
read = "{{.Text}}"

[slack_search]
description = "Search the Slack messages the user can read, newest first: one line per message, \"<permalink> · <author> · <time> · <first line>\", times in the user's time zone. Direct messages show only when tracked. Pass a permalink, or the ref a line without one prints, to slack_read to read its thread, or to slack_post to act on it."

[slack_search.params]
"query" = "what to look for, as Slack's search box reads it"
"channel" = "only in this channel: #name or channel id"
"from" = "only by this person: @handle, user id or email"
"after" = "only after this day, YYYY-MM-DD, the day itself excluded"
"before" = "only before this day, YYYY-MM-DD, the day itself excluded"
"limit" = "how many messages to show, at most 100. Default 20"

[slack_search.answers]
refused = "slack_search refused: {{.Error}}."
bad_arguments = "Nothing was searched: the arguments are not an object with query, and channel, from, after, before and limit when needed{{with .Error}} ({{.}}){{end}}."
fix_these = """Nothing was searched; fix these and call slack_search again:
{{.Problems}}"""
not_logged_in = "not logged in to Slack; run \"{{.Command}} slack login\""
failed = "Slack search failed: {{.Error}}"
problem_query_required = "query: required, not empty"
problem_after = "after: a date, YYYY-MM-DD"
problem_before = "before: a date, YYYY-MM-DD"
problem_before_after = "before: a date after after"
problem_limit = "limit: an integer from 1 to {{.Max}}"
found = "{{.Text}}"
