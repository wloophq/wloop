summary = "Close a Slack task of one thread once you posted last, after an answer to each ask you made, and nobody spoke since, for 3 days, once the extraction read its newest message; it resolves the task's items as answered"
provider = "task"
when = 'task.prop.kind == "thread" && task.items_open > 0 && !(task.category in ["done", "dropped", "deferred"]) && size(task.units) == 1 && task.link_signal.replied_last && !task.link_signal.asked_reacted && !task.link_signal.extraction_pending'
key = ["task.fingerprint"]
order = 58

[[step]]
use = "items.resolve"
resolution = "answered"
