summary = "Close a Slack conversation no item came from once it ended, whoever started it, unless an open task of yours holds it, without a message: it records the closure, which ends the tasks that hold it, stops watching it and takes it out of the Slack view"
provider = "slack"
when = '!slack.closure_posted && slack.ended && slack.items_open == 0 && slack.items_resolved == 0 && !slack.open_task && slack.extracted'
order = 53

[[step]]
use = "effects.apply"
effects = ["unit.closed"]
