summary = "Offer to close a Slack task whose threads all ended, a closure posted or marked or quiet for plugins.slack.ended_after, when no other signal offers it; it resolves the task's items as moot and posts nothing"
provider = "task"
when = 'task.prop.kind == "thread" && task.items_open > 0 && !(task.category in ["done", "dropped", "deferred"]) && task.link_ended && !(size(task.units) == 1 && (task.link_signal.asked_reacted || task.link_signal.replied_last))'
key = ["task.fingerprint"]
order = 59

[[step]]
use = "items.resolve"
resolution = "moot"

[[gates.approval.rule]]
when = 'gate.kind == "plan"'
mode = "wait"
