summary = "Nudge everyone in the conversation a stalled Slack task waits on in one message on the thread, mentioning each and listing the open items they owe, once per drafts.repeat_after"
provider = "task"
when = '"slack" in task.unit_providers && task.owed_by != "me" && task.owed_by != "" && task.check_on > timestamp(0) && task.check_on <= now && task.prop.last_nudge + config.drafts.repeat_after <= now'
order = 50
key = ["task.settled_at", "task.owed_by"]

[[step]]
use = "draft.propose"
purpose = "nudge"
items = "owed"
to = "members"
effects = ["task.nudged"]
repeat_after = "config.drafts.repeat_after"

[drafts.withdraw]
when = '!draft.person_waited || draft.items_owed == 0 || draft.person_asks_you'
reason = "moot"

[[drafts.withdraw.rule]]
when = 'draft.people_outside > 0'
reason = "outside"

[outbox]
title = "Ask who hasn't answered"
about = "Drafted when a conversation where you wait on someone goes quiet."
