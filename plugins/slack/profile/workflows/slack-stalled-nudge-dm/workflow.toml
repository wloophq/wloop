summary = "Nudge each person a stalled Slack task waits on who is not in its conversation, in your direct conversation with them, quoting the open items they owe, once per drafts.repeat_after"
provider = "task"
when = '"slack" in task.unit_providers && task.owed_by != "me" && task.owed_by != "" && task.check_on > timestamp(0) && task.check_on <= now && task.prop.last_nudge + config.drafts.repeat_after <= now'
order = 51
key = ["task.settled_at", "task.owed_by"]

[[step]]
use = "draft.propose"
purpose = "nudge"
items = "owed"
per = "person"
to = "non_members"
target = "person"
text = "dm.md.tmpl"
why = "dm_why.md.tmpl"
effects = ["task.nudged"]
repeat_after = "config.drafts.repeat_after"

[drafts.withdraw]
when = '!draft.person_waited || draft.items_owed == 0 || draft.person_asks_you'
reason = "moot"

[outbox]
title = "Ask who is not in the conversation"
about = "Drafted in your direct conversation with someone a quiet conversation waits on, who cannot read it."
