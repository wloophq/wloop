summary = "Nudge each person a stalled Slack task waits on who is not in its conversation, in your direct conversation with them, quoting the open items they owe, at most once in the interval your drafts settings set, until the newest of those items is as old as your drafts settings let a nudge be; the message is a draft you approve before it posts"
provider = "task"
when = '"slack" in task.unit_providers && task.owed_by != "me" && task.owed_by != "" && task.check_on > timestamp(0) && task.check_on <= now && task.prop.last_nudge + config.drafts.repeat_after <= now'
order = 51
key = ["task.settled_at", "task.owed_by"]

# The draft quotes an item of another conversation the person cannot read: it always waits for you.
[gates]
drafts_wait = true

[[step]]
use = "draft.propose"
purpose = "nudge"
leave_unmentionable = "true"
items = "owed"
per = "person"
to = "non_members"
target = "person"
effects = ["task.nudged"]
repeat_after = "config.drafts.repeat_after"

[drafts.withdraw]
when = '!draft.person_waited || draft.items_owed == 0 || draft.person_asks_you || draft.people_unmentionable > 0 || config.drafts.stale_after_days > 0 && draft.items_age_days >= config.drafts.stale_after_days'
reason = "moot"

[[drafts.withdraw.rule]]
when = 'draft.target_joined'
reason = "joined"

[outbox]
title = "Ask who is not in the conversation"
about = "Drafted in your direct conversation with someone a quiet conversation waits on, who cannot read it."
