summary = "Close a Slack task of one thread once whoever asked, or whom it waits on, checked a later message, such as your answer, with a check mark, once the extraction read its newest message; it resolves the task's items as done"
provider = "task"
when = 'task.prop.kind == "thread" && task.items_open > 0 && !(task.category in ["done", "dropped", "deferred"]) && size(task.units) == 1 && task.link_signal.asked_reacted && !task.link_signal.extraction_pending'
key = ["task.fingerprint"]
order = 57

[[step]]
use = "items.resolve"
resolution = "done"
