summary = "Close a Slack thread you started once its items resolved, listing each item's resolution"
provider = "slack"
when = 'slack.started_by_me && !slack.closure_posted && slack.items_open == 0 && slack.items_resolved > 0'
order = 51
key = ["slack.settled_at"]

[[step]]
use = "draft.propose"
purpose = "close"
items = "resolved"
effects = ["unit.closed"]
repeat_after = "config.drafts.repeat_after"
repeat_after_sent = "forever"

[drafts.withdraw]
when = '!draft.unit_open'
reason = "moot"
