# Whether a draft that replies in a thread is also posted to its
# conversation (Slack's reply_broadcast) when its proposer did not say. The
# person turns it on the draft before approving it. A user profile's
# plugins/slack/drafts.toml replaces this file; a key it leaves out is false.

[broadcast]
# By the kind of conversation the thread is in: a direct message, a group
# direct message, a public or private channel. In a direct message a reply in
# an older thread does not show in the conversation.
im      = true
mpim    = true
channel = false
# A reply the person writes, in any conversation: they chose the thread.
user    = false
