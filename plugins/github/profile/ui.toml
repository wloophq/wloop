[detail.profile_chain]
label = "Review profile"
title = "The review profile layers a round here reads, lowest first; the profile show command lists the files"

[detail.next_guidance]
label = "Next round guidance"
title = "Guidance waiting for the next round: given with no round pending, or kept from a round that did not go out or whose prompt was not seen landing. The next round, Review or Address included, takes it unless you give other guidance"

[menubar]
loop = "In loop"
