# The predicates the GitHub plugin's manifest declares, over the facts of
# the pull request it reports. A user profile's plugins/github/predicates.toml
# replaces the keys it sets.

# Whether an open pull request waits for a reviewer before its merge; in a
# repository where nobody reviews, such as
# "!(pr.owner in ['acme'])", a pull request with no reviewer asked is merge.
reviewer_required = "true"

# Whether the loop reviews an open, ready pull request I did not open, with
# no request of my review by name; its first round starts once, under the
# same trust rules, and no daily cap bounds how many start. "pr.repo ==
# 'acme/api' && !pr.mine"
# reviews every pull request of acme/api others open, every open one at
# once when it starts holding. A fact the author controls, such as
# pr.labels, lets authors opt themselves in.
review_wanted = "pr.review_requested_me"
