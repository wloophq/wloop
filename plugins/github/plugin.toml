[[source.roles]]
name = "pr.review"
doc = "The review round on someone else's pull request, in its review workspace: first or follow-up, reconciled with the review you published; it drives its workspace's row."
round_kind = "review"
reconcile = "my_review"
workspace = "review"
context = "pr"
policy = "round"
drives_row = true

[[source.roles]]
name = "pr.address"
doc = "The address round on a pull request you develop, in its author workspace: its reviews, failing checks and conflicts; its instructions say why it is due; it drives its workspace's row."
round_kind = "address"
workspace = "author"
context = "pr"
policy = "round"
drives_row = true

[[source.roles]]
name = "pr.nudge"
doc = "The nudge on a pull request: nudge.prepare fills its inputs from who the pull request waits on, or refuses it."
prepare = "action:nudge.prepare"
context = "pr"
policy = "round"

[[source.roles]]
name = "probe"
doc = "The probe of an agent home: a synthetic pull request in the workspace the request names, under the probe's policy."
launch = "probe"
context = "synthetic"
policy = "probe"

[[source.events]]
name = "opened"
doc = "The pull request opened."

[[source.events]]
name = "push"
doc = "A commit was pushed to the head."

[[source.events]]
name = "review_requested"
doc = "A review was requested."

[[source.events]]
name = "review_request_removed"
doc = "A review request was removed."

[[source.events]]
