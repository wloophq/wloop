doc = "A follow-up review the sweep observed without running, its review workspace gone."

[[source.events]]
name = "would_address"
doc = "An address round the sweep observed without running, the pull request having no author workspace."

[[source.events]]
name = "review_ended"
doc = "A pull request with a review turn and no review workspace closed or merged."

[[source.effects]]
name = "pr.reviewed"
applies = ["turn", "draft"]
doc = "Writes the plugin mark reviewed: the reviews the round covered, once its review is submitted."

[[source.effects]]
name = "pr.addressed"
applies = ["turn"]
doc = "Writes the plugin marks addressed.*: the reviews, checks and conflict the address round covered."

[[source.effects]]
name = "pr.nudged"
applies = ["turn", "draft"]
doc = "Records the nudged event on the pull request, which the nudge refusal reads: when its turn is sent, keyed by the turn so that a turn that ended before its agent started it does not count, or as the GitHub publisher posts its draft."

