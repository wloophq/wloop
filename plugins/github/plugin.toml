id = "github"
kinds = ["source"]
protocol = 1

[source]
name = "GitHub"
slot = "pr"
brief_subject = true
rounds = true
payload = "PR"
kinds = ["pull-request"]
steps = ["turn.dismiss", "answer.refuse"]
row_kinds = ["round_pending", "loop_waiting", "loop_stopped", "blocked", "to_address", "held", "loop_working",
  "changes", "checks", "conflicts", "reply", "reviewer_back", "review", "no_reviewer", "merge", "draft", "muted", "done"]

default_delivery = "comment"
config_reads = ["sweep", "views", "projects", "brief"]
notify = ["workspaces", "events", "turns", "viewer", "config", "rounds", "marks", "overrides"]

[[source.signals]]
name = "stalled"
doc = "The pull request's situation lasted past its stalled threshold, in working days."

[[source.signals]]
name = "in_loop"
doc = "A review workspace holds the pull request: the loop reviews it."

[[source.signals]]
name = "ready"
doc = "The work on the pull request is approved: my review approved its head, or my own can merge."

[[source.signals]]
name = "workspace"
doc = "A workspace of the pull request remains on disk, a review or an author one, whatever the pull request's state."

[[source.predicates]]
name = "reviewer_required"
facts = ["pr.repo", "pr.repo_name", "pr.owner", "pr.slug", "pr.author", "pr.state", "pr.ended", "pr.merged_at", "pr.closed_at",
  "pr.draft", "pr.changed_files", "pr.head", "pr.conflicting_for", "pr.mine", "pr.base", "pr.cross_repository", "pr.requested_teams",
  "pr.review_requested_me", "pr.checks", "pr.age", "pr.adopted", "pr.stale", "pr.visibility", "pr.association", "pr.labels",
  "pr.last_review.exists", "pr.last_review.verdict", "pr.last_review.decision", "pr.last_interaction_at", "pr.silent_days"]
doc ="An open pull request waits for a reviewer before its merge. Where it does not hold, a pull request nobody was asked to review is never no_reviewer: with checks green and no conflict it is merge, as an approved one is, and no nudge asks for a reviewer."

[[source.marks]]
name = "addressed.reviews"
doc = "The newest review an address round triaged on a pull request you develop, a time: `handled(\"addressed.reviews\", <time>)`."

[[source.marks]]
name = "addressed.checks"
doc = "The head whose failing checks an address round covered: `handled(\"addressed.checks\", pr.head)`."

[[source.marks]]
name = "addressed.conflict"
doc = "The head whose conflict with the base an address round covered: `handled(\"addressed.conflict\", pr.head)`."

[[source.situations]]
name = "round_pending"
doc = "A round waits on you before it starts."

[[source.situations]]
name = "loop_waiting"
doc = "A turn on the pull request asks you a question no answer reached yet, or the agent of the round waits on you."

[[source.situations]]
name = "loop_stopped"
doc = "The agent of the round stopped before it ended its turn."

[[source.situations]]
name = "blocked"
doc = "A round cannot start until you free the head branch, trust its folder or answer the agent's question."

[[source.situations]]
name = "to_address"
doc = "An address round is due on your pull request."

[[source.situations]]
name = "held"
doc = "A due round is held by the daily cap."

[[source.situations]]
name = "loop_working"
doc = "The agent of a round works on the pull request."

[[source.situations]]
name = "changes"
doc = "Changes were asked of the author."

[[source.situations]]
name = "checks"
doc = "The checks on the head fail."

[[source.situations]]
name = "conflicts"
doc = "The head conflicts with the base."

[[source.situations]]
name = "reply"
doc = "Someone waits for the author's reply."

[[source.situations]]
name = "reviewer_back"
doc = "A reviewer is due to look again."

[[source.situations]]
name = "review"
doc = "A review is requested and not given."

[[source.situations]]
name = "no_reviewer"
doc = "No reviewer is requested."

[[source.situations]]
name = "merge"
doc = "The pull request is approved and can merge."

[[source.situations]]
name = "draft"
doc = "The pull request is a draft."

[[source.situations]]
name = "muted"
doc = "You muted the pull request."

[[source.situations]]
name = "done"
doc = "The pull request merged or closed."

[source.codec]
keys = ["{owner}/{repo}#{number}"]
urls = ["https://github.com/{owner}/{repo}/pull/{number}"]
label = "{owner}/{repo}#{number}"
fold_case = true
target = "<url>"

[source.codec.fields]
number = "[1-9][0-9]*"

