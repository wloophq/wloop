name = "problem_kind"
doc = "A problem: kind is none of the kinds."
fields = [{ name = "Kinds" }]

[[source.tools.answers]]
name = "problem_text_required"
doc = "A problem: the kind needs a text, and it is missing or empty."

[[source.tools.answers]]
name = "problem_payload"
doc = "A problem: the payload does not fit the kind's schema."
fields = [{ name = "Error" }]

[[source.tools.answers]]
name = "problem_basis_required"
doc = "A problem: the kind needs the head commit the agent read as basis."

[[source.tools.answers]]
name = "stale"
doc = "The basis is not the pull request's head now; nothing was drafted."
fields = [{ name = "Basis" }, { name = "Head" }]

[[source.tools.answers]]
name = "proposed"
doc = "The draft waits for the user's approval."
fields = [{ name = "ID", number = true }, { name = "Rev", number = true }, { name = "Unit" }]

[[source.tools.answers]]
name = "approved"
doc = "A rule of the user's approved the draft, and it will be posted."
fields = [{ name = "ID", number = true }, { name = "Rev", number = true }, { name = "Unit" }]

[[source.tools.answers]]
name = "dry_run"
doc = "The draft's approval is a dry run: it is stored and never posted."
fields = [{ name = "ID", number = true }, { name = "Rev", number = true }, { name = "Unit" }]

[[source.tools]]
name = "github_threads"
doc = "Reads the unresolved review threads of the session's pull request, with their comment ids, and each reviewer's latest review."
reads = true
input = '{"type":"object","properties":{},"additionalProperties":false}'

[[source.tools.answers]]
name = "failed"
doc = "GitHub or the daemon failed the call."
fields = [{ name = "Error" }]

[[source.tools.answers]]
name = "threads"
doc = "The threads and reviews, as JSON."
fields = [{ name = "Unit" }, { name = "JSON" }]

