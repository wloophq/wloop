name: CI

on:
  pull_request:

permissions: {}

jobs:
  diag-chrome:
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go # zizmor: ignore[self-repository]
        with:
          cache: macos
      - run: go test -c -o /tmp/web.test ./internal/web && go test -c -o /tmp/cli.test ./internal/cli && go test -c -o /tmp/e2e.test ./internal/e2e
      - run: go build -o /tmp/dumptime ./diag/dumptime
      - name: Dump time under load
        run: |
          (while true; do (cd internal/cli && /tmp/cli.test >/dev/null 2>&1); done) &
          (while true; do (cd internal/e2e && /tmp/e2e.test >/dev/null 2>&1); done) &
          /tmp/dumptime
          kill %1 %2 || true
