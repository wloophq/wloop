name: Cache

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: go
        uses: ./.github/actions/setup-go # zizmor: ignore[self-repository] actionlint 1.7.12 rejects the $/ form
        with:
          cache: build
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - run: GOOS=darwin CGO_ENABLED=0 go vet ./...
      - run: |
          for t in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64; do
            CGO_ENABLED=0 GOOS=${t%/*} GOARCH=${t#*/} go build ./...
          done
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.go.outputs.paths }}
          key: ${{ steps.go.outputs.key }}

  test-shard:
    strategy:
      matrix:
        shard: [daemon, store, cli, sources, rest]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: go
        uses: ./.github/actions/setup-go # zizmor: ignore[self-repository] actionlint 1.7.12 rejects the $/ form
        with:
          cache: test-${{ matrix.shard }}
      - run: |
          pkgs=$(scripts/test-shard.sh "$SHARD")
          # shellcheck disable=SC2086
          go test -race -run '^$' $pkgs
        env:
          SHARD: ${{ matrix.shard }}
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.go.outputs.paths }}
          key: ${{ steps.go.outputs.key }}

  test-macos:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: go
        uses: ./.github/actions/setup-go # zizmor: ignore[self-repository] actionlint 1.7.12 rejects the $/ form
        with:
          cache: macos
      - run: go test -run '^$' ./...
      - run: CGO_ENABLED=0 go test -run '^$' ./internal/client/menubar/macos/
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.go.outputs.paths }}
          key: ${{ steps.go.outputs.key }}

  prune:
    needs: [build, test-shard, test-macos]
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete the Go caches older commits of main saved
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          gh cache list --ref refs/heads/main --key go- --limit 1000 --json id,key --jq '.[] | select(.key | endswith("-" + env.SHA) | not) | .id' |
            while read -r id; do gh cache delete "$id"; done
