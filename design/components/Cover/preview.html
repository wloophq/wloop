<!-- @dsCard height=288 -->
<!doctype html><html><body>
<style>
body{margin:0;background:var(--bg)}
.cv{position:relative;width:960px;height:288px;overflow:hidden;background:var(--bg)}
svg{position:absolute;left:0;top:0}
.b{rx:var(--radius-md);ry:var(--radius-md)}
.me{fill:var(--me)}.loop{fill:var(--loop)}.reviewer{fill:var(--reviewer)}.author{fill:var(--author)}.late{fill:var(--late)}
.hair{stroke:var(--rule);stroke-width:1}
.txt{position:absolute;left:40px;bottom:36px;max-width:440px}
.name{font:700 120px/.92 var(--font-mono);letter-spacing:.02em;color:var(--ink);margin:0}
.tag{font:400 14px/1.4 var(--font-sans);color:var(--muted);margin:16px 0 0}
</style>
<div class="cv">
<svg width="960" height="288" viewBox="0 0 960 288" aria-hidden="true">
<!-- blocks: me 440 wide (bleeds right), loop 330, reviewer 250, author 290, late 96; all 40 tall, radius-md -->
<!-- arrangement: a stack of unequal bands left-aligned at x=520, like rows of the list waiting different lengths of time -->
<!-- pattern: hairlines in rule between bands, the table's row dividers; chosen because the waits-on strip on a ruled list is the system's signature -->
<!-- scales: band 40, gap space-8 (8px), inset space-24, radius-md; the late block is the age chip -->
<line class="hair" x1="480" y1="72" x2="960" y2="72"/>
<line class="hair" x1="480" y1="120" x2="960" y2="120"/>
<line class="hair" x1="480" y1="168" x2="960" y2="168"/>
<line class="hair" x1="480" y1="216" x2="960" y2="216"/>
<rect class="b me" x="520" y="28" width="460" height="40"/>
<rect class="b loop" x="520" y="76" width="330" height="40"/>
<rect class="b reviewer" x="520" y="124" width="250" height="40"/>
<rect class="b author" x="520" y="172" width="290" height="40"/>
<rect class="b late" x="520" y="220" width="96" height="40"/>
</svg>
<div class="txt"><p class="name">wloop</p><p class="tag">What waits on you, and for how long.</p></div>
</div>
</body></html>
