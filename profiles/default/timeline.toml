# What the timeline calls each of the core's event kinds and the tone it draws them in; a plugin words its own
# kinds in its ui.toml. The [facts] below fold a task's events into the few facts a person reads; a plugin's layer
# adds its own, and a higher layer replaces a fact of the same name whole.

[events.held]
label = "paused"
tone = "me"

[events.released]
label = "resumed"
tone = "me"

[events.muted]
label = "muted"
tone = "me"

[events.unmuted]
label = "unmuted"
tone = "me"

[events.adopted]
label = "adopted"
tone = "me"

[events.status]
label = "board"
tone = "me"

[events.removed]
label = "workspace removed"
tone = "loop"

[events.nudged]
label = "nudged"
tone = "loop"

[events.tracked]
label = "tracked"
tone = "me"

[events.untracked]
label = "untracked"
tone = "me"

[events.answered]
label = "answered"
tone = "me"

