[facts.round]
start   = ["turn_sent", "turn_started"]
end     = ["turn_ended", "turn_stopped", "turn_withdrawn"]
absorb  = ["turn_delivered", "turn_resumed", "stop_blocked", "guide_trimmed", "late_record", "dossier_restored", "dossier_granted", "dossier_call", "record", "session_prompted", "session_typed", "session_idle", "session_active", "mcp_seen"]
label   = "Agent round, {{.duration}}"
running = "Agent round running"
unfinished = "Agent round, no end recorded"
tone    = "loop"
order   = 10

[facts.answer]
start  = ["answered"]
absorb = ["answer_routed", "answer_read"]
label  = "You answered the agent"
tone   = "me"
order  = 20

[facts.decision]
start = ["gate_resolved"]
label = "Decision resolved"
tone  = "me"
order = 30

[facts.moved]
start = ["verb_next", "verb_waiting", "verb_schedule", "verb_someday", "verb_reference", "verb_done", "verb_dismiss", "verb_acknowledge", "verb_not-mine", "verb_hand-to"]
label = "Moved: {{.event}}"
tone  = "me"
order = 40

[facts.board]
start = ["status"]
label = "Board: {{.sub}}"
tone  = "me"
order = 41
