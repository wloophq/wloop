summary = "Remove a review workspace whose pull request ended more than cleanup.workspace_grace ago"
provider = "workspace"
when = '!workspace.main && workspace.role == "review" && workspace.pr_state in ["MERGED", "CLOSED"] && workspace.pr_finished_for > config.cleanup.workspace_grace && workspace.path_exists'
observe = true
order = 20

[[step]]
use = "workspace.remove"

[limits]
per_run = 5
per_day = 30

[[gates.approval.rule]]
when = 'gate.kind == "plan" && (workspace.dirty > 0 || workspace.untracked > 0 || workspace.unpushed > 0 || "checkout unreadable" in workspace.pendency)'
mode = "wait"
