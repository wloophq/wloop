description = "Follow up a review when its pull request moved since"
subject = "github"
when = 'pr.review.action == "follow-up"'
order = 10
key = ["pr.fingerprint"]

[trigger]
every = "sweep"

[[step]]
use = "turn.start"
intent = "review"
round = "follow-up"

[approval]
default = "run"
window = "60s"
