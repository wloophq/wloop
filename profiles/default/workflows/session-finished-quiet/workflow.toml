summary = "Close a loop session whose newest turn ended and that stayed quiet for a while, as your cleanup settings set"
provider = "session"
when = 'session.managed && session.newest_state in ["done", "settled", "failed"] && session.idle_for > config.cleanup.idle'
order = 13

[[step]]
use = "session.close"

[limits]
per_run = 10
per_day = 100
