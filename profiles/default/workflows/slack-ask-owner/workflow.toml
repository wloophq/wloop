description = "Ask who owns the open items of a Slack unit you track that nobody owns after a working day"
subject = "slack"
when = 'slack.live_entry && slack.items_unowned > 0 && slack.items_unowned_age_days >= 1'
mode = "apply"
order = 52
key = ["slack.settled_at"]

[draft_approval]
mode = "always"

[trigger]
every = "sweep"

[[step]]
use = "draft.propose"
purpose = "ask_owner"
items = "unowned_aged"
hold = "config.proposals.renudge_after"

[withdraw]
when = 'draft.items_owned > 0'
reason = "assigned"
