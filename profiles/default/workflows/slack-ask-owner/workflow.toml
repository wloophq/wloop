summary = "Ask who owns the open items of a Slack unit you track that nobody owns after a working day"
provider = "slack"
when = 'slack.live_task && slack.items_unowned > 0 && slack.items_unowned_age_days >= 1'
order = 52
key = ["slack.settled_at"]

[drafts.approval]
mode = "wait"

[[step]]
use = "draft.propose"
purpose = "ask_owner"
items = "unowned_aged"
repeat_after = "config.drafts.repeat_after"

[drafts.withdraw]
when = 'draft.items_assigned > 0'
reason = "assigned"
