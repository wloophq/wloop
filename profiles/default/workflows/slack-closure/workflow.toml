summary = "Close a Slack thread you started once its items resolved, listing each item's resolution"
provider = "entry"
when = '"slack" in task.unit_providers && task.kind == "close" && task.state in ["inbox", "next"] && task.items_resolved > 0'
order = 51
key = ["task.settled_at"]

[[step]]
use = "draft.propose"
purpose = "close"
items = "resolved"
effects = ["unit.closed"]
repeat_after = "config.drafts.repeat_after"
repeat_after_sent = "forever"

[drafts.withdraw]
when = '!draft.unit_open'
reason = "moot"
