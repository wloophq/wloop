summary = "Star in Focus an open task past its due date, or one someone else owes that went stale with no nudge since"
provider = "task"
when = '!(task.prop.focus in ["on", "off"]) && (task.prop.due > timestamp(0) && task.prop.due <= now || task.owed_by != "me" && task.owed_by != "" && task.check_on > timestamp(0) && task.check_on <= now && task.prop.last_nudge < task.owed_since)'
order = 54

[[step]]
use = "task.set"
prop = "focus"
value = "on"

[[step]]
use = "task.set"
prop = "autostar"
value = "on"
