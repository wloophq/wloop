description = "Close a session whose worktree path or transcript is gone, or that its manager closed"
subject = "session"
when = 'session.worktree_gone || session.transcript_gone || session.closed_by_manager'
mode = "apply"
order = 15

[trigger]
every = "sweep"

[[step]]
use = "session.close"

[limits]
per_run = 10
per_day = 100
