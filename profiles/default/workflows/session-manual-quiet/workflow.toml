summary = "Offer to close a session you started that stayed quiet for cleanup.manual_idle"
provider = "session"
when = '!session.managed && session.agent_state == "done" && session.idle_for > config.cleanup.manual_idle'
order = 16

[[step]]
use = "session.close"

[limits]
per_run = 10
per_day = 100

[[gates.approval.rule]]
when = 'gate.kind == "plan"'
mode = "wait"
