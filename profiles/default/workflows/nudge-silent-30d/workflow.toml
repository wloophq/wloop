description = "Nudge whoever someone else's open pull request waits on after a long silence"
subject = "github"
when = 'pr.state == "open" && !pr.draft && !pr.mine && !pr.adopted && !pr.waits_on_user && pr.silent_days >= config.nudge.silent_days'
order = 40
key = ["pr.last_interaction_at"]

[trigger]
every = "sweep"

[[step]]
use = "turn.start"
intent = "nudge"

[approval]
default = "wait"
window = "60s"
