summary = "When you acknowledge a task with a time, propose a reply saying you are looking into it, by that time"
provider = "task"
when = 'trigger.event.kind == "verb_acknowledge" && task.promised > timestamp(0)'
key = ["trigger.event.id"]
order = 54

[trigger]
on = ["verb_acknowledge"]
actors = ["person", "agent"]

[[step]]
use = "draft.propose"
purpose = "acknowledge"
delivery = "message"

[outbox]
title = "Say you're on it, by when"
about = "Drafted when you acknowledge a task and give it a time."
