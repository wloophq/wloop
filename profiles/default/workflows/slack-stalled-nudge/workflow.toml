description = "Nudge each person a stalled Slack waiting entry waits on, listing the open items they owe"
subject = "entry"
when = 'entry.unit_provider == "slack" && entry.nudge_due_at > timestamp(0) && entry.items_held > 0'
mode = "apply"
order = 50
key = ["entry.settled_at", "entry.waiting_on"]

[trigger]
every = "sweep"

[[step]]
use = "draft.propose"
purpose = "nudge"
items = "owed"
per = "person"
on_posted = "entry.nudged"
hold = "config.proposals.renudge_after"

[withdraw]
when = '!draft.person_waited || draft.items_held == 0'
reason = "moot"
