summary = "Nudge each person a stalled Slack waiting task waits on, listing the open items they owe"
provider = "entry"
when = '"slack" in task.unit_providers && task.nudge_due_at > timestamp(0) && task.items_owed > 0'
order = 50
key = ["task.settled_at", "task.waiting_on"]

[[step]]
use = "draft.propose"
purpose = "nudge"
items = "owed"
per = "person"
effects = ["task.nudged"]
repeat_after = "config.drafts.repeat_after"

[drafts.withdraw]
when = '!draft.person_waited || draft.items_owed == 0'
reason = "moot"
