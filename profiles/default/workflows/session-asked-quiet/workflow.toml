summary = "Close a loop session whose newest turn asked and that stayed quiet for a while after asking, as your cleanup settings set; posts nothing"
provider = "session"
when = 'session.managed && session.newest_state == "asked" && session.idle_for > config.cleanup.asked_idle'
order = 14

[[step]]
use = "session.close"

[limits]
per_run = 10
per_day = 100
