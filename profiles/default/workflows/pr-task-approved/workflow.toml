summary = "Close the task of someone else's pull request once you approved it and nothing there waits on you: merging it is its author's; a new review asked of you brings the task back"
provider = "task"
when = 'task.prop.kind == "pull-request" && task.link_signal.approved_by_me && !("me" in task.link_owes) && task.gates_open == 0 && !(task.category in ["done", "dropped"])'
order = 53

[[step]]
use = "task.verb"
verb = "done"
