summary = "When you say a task is not yours, propose a reply pointing the asker elsewhere, for you to edit and approve; off by default, since saying a task is not yours is triage for your list"
provider = "task"
when = 'trigger.event.kind == "verb_not-mine"'
enabled = false
key = ["trigger.event.id"]
order = 54

[trigger]
on = ["verb_not-mine"]
actors = ["person", "agent"]

[[step]]
use = "draft.propose"
purpose = "redirect"
delivery = "message"

[outbox]
title = "Point the asker elsewhere"
about = "Drafted when you say a task is not yours."
