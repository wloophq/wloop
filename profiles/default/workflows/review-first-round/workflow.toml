summary = "Start the first review round of a pull request that requests my review"
provider = "github"
when = 'pr.first.due'
order = 20
key = ["pr.fingerprint"]

[[step]]
use = "turn.start"
intent = "review"
stage = "first"

[[gates.approval.rule]]
when = 'gate.kind == "plan"'
mode = "delay"
window = "60s"
