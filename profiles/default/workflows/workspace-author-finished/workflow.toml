summary = "Remove your workspace whose pull request ended more than cleanup.workspace_grace ago"
provider = "workspace"
when = '!workspace.main && workspace.role == "author" && workspace.pr_state in ["MERGED", "CLOSED"] && workspace.pr_finished_for > config.cleanup.workspace_grace && workspace.path_exists'
observe = true
order = 21

[[step]]
use = "workspace.remove"

[limits]
per_run = 5
per_day = 30

[[approval.rule]]
when = 'size(workspace.pendency) > 0'
mode = "wait"
