description = "Remove your workspace whose pull request ended more than cleanup.workspace_grace ago"
subject = "workspace"
when = '!workspace.main && workspace.role == "author" && workspace.pr_state in ["merged", "closed"] && workspace.pr_finished_for > config.cleanup.workspace_grace && workspace.path_exists'
mode = "observe"
order = 21

[trigger]
every = "sweep"

[[step]]
use = "workspace.remove"

[limits]
per_run = 5
per_day = 30

[approval]
wait_when = 'size(workspace.pendency) > 0'
