summary = "Merge a task into the task of a pull request its items' review or merge links target, such as a Slack ask to review it"
provider = "task"
when = 'size(task.link_target_tasks) > 0'
key = ["task.fingerprint", "task.items_changed_at", "task.link_target_tasks"]
order = 60

[[step]]
use = "task.verb"
verb = "merge"
task = "task.link_target_tasks"

# A link to the pull request is enough: the merge runs at once, and Split
# gives it back. A pair you took apart waits for you instead.
[[gates.approval.rule]]
when = 'gate.kind == "proposal" && gate.name == "merge"'
mode = "run"
