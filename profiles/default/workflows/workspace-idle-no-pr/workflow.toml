summary = "Offer to remove a workspace with no pull request, no session and no activity for cleanup.stale_workspace"
provider = "workspace"
when = '!workspace.main && workspace.pr == "" && workspace.sessions == 0 && workspace.quiet_for > config.cleanup.stale_workspace && workspace.path_exists'
order = 25

[[step]]
use = "workspace.remove"

[limits]
per_run = 5
per_day = 30

[approval]
mode = "wait"
[[approval.rule]]
when = 'size(workspace.pendency) > 0'
mode = "wait"
