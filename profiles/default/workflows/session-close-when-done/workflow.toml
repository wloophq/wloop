description = "Close a session whose newest turn is done when its intent closes when done"
subject = "session"
when = 'session.newest_state == "done" && session.closes_when_done'
mode = "apply"
order = 12

[trigger]
every = "sweep"

[[step]]
use = "session.close"

[limits]
per_run = 10
per_day = 100
