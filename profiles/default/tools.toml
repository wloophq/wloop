fix_these = """The record was refused; fix these and call turn_end again:
{{.Problems}}"""
problem_extra_arguments = "arguments: only turn and record, not {{.Keys}}"
problem_turn_type = "turn: a string, the id on the first line of the turn's instructions"
problem_turn_required = "turn: required; the id on the first line of the turn's instructions"
problem_record_required = "record: required"
problem_record = "record: {{.Error}}"
refused_record = "{{.Name}} refused the record: {{.Reason}}."
store_failed = "{{.Name}} could not store the record: {{.Error}}; call turn_end again."
recorded = "Recorded {{.State}} for {{.Unit}}{{with .Note}}, but {{.}}{{end}}.{{with .Dropped}} {{.}}{{end}} End your turn.{{with .Ledger}} Ledger: {{.}}.{{end}}"
ledger_applied = "{{.Count}} applied"
ledger_unchanged = "{{.Count}} unchanged"
ledger_proposed = "{{.Count}} proposed to the user"
ledger_refused = "{{.Count}} refused: {{.Why}}"
