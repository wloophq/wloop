approved = "Draft {{.ID}} on {{.Unit}} is approved by its policy and will be posted to {{or .Where \"its conversation\"}}; nothing was posted yet."
dry_run = "Draft {{.ID}} on {{.Unit}} is a dry run: its approval stores drafts and never sends them, so it will not be posted to {{or .Where \"its conversation\"}}."

[slack_react]
description = "Add a reaction to a Slack message as the user, or remove one, at once and without their approval, such as swapping an hourglass for a check mark on a status reply. When it is unclear whether the user wants it, ask them first."

