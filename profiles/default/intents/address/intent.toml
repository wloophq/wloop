label   = "Address"
summary = "Triage the reviews and failing checks of a pull request you develop, in its workspace, changing its code where they call for it; Act only settles open items and drafts replies"
verb    = "delegate"
shortcut = "F"
role    = "pr.address"
provider = "github"
skill = true
why     = "{{.pr.address.reason}}"
workspace = "author"
session   = { strategy = "reuse_live", title = "triage" }
intake    = true
start_line = "starting the address round"
owner_only = true
profile   = "address"
dims      = ["reviewer"]
effects   = ["pr.addressed", "pr.counted", "guidance.handed", "pr.round_sent", "plan.cleared"]

[help]
target   = "a pull request URL"
summary  = "Triage the reviews and failing checks of yours"
group    = "pull requests"
examples = ["https://github.com/acme/api/pull/7", "--self-review https://github.com/acme/api/pull/7 the plan is in the description"]
docs     = "guides/address"

[guidance]
help = "what the round should look at"

[headline]
resumed = "address round on {{.pr.slug}}"
[[headline.new]]
when = 'turn.needs_take_over'
line = "Address round on {{.pr.slug}}, which someone else opened: ask before taking it over."
[[headline.new]]
when = 'inputs.take_over'
line = 'Take over {{.pr.slug}} and address it, {{template "started_by" .}}.'
[[headline.new]]
line = 'Address round on {{.pr.slug}}, {{template "started_by" .}}.'

[inputs.take_over]
type   = "bool"
flag   = "--take-over"
help   = "takes it over first"
before = "take_over"

[inputs.self_review]
type = "bool"
flag = "--self-review"
help = "reviews the change with the review profile first, against the guidance as its plan, and fixes what it finds; nothing of that review is published"
persist = true
by_hand_only = true

[[also_profile]]
profile = "review"
when    = "inputs.self_review && !turn.needs_take_over"
dims    = { stage = "first" }
define  = "review-judgment"
prefix  = "review guide: "

[action]
primary = { when = "!row.question && (pr.mine || pr.adopted)" }
warning = "{{if .row.question}}Starts a new round; the agent's open question is replaced{{end}}"

[[action.refuse]]
when = "!(pr.mine || pr.adopted || row.author_workspace)"
why  = "Not yours: take it over first"

[join]
differs_on = ["self_review"]

[record]
when      = '!turn.needs_take_over'
states    = ["done", "asked", "failed"]
artifacts = ["triage"]
history_artifact = "triage"
