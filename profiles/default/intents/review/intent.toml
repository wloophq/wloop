label   = "Review"
summary = "Start or continue a review round on someone else's pull request, in a dedicated workspace"
verb    = "delegate"
shortcut = "V"
role    = "pr.review"
provider = "github"
skill = true
why     = "{{.pr.review.reason}}"
workspace = "review"
session   = { strategy = "reuse_live", title = "review", name = '{{.session.title}} {{.unit.label}} {{.session.started.Format "02/01 15:04"}}' }
intake    = true
start_line = "starting the review"
profile   = "review"
dims      = ["stage"]
effects   = ["pr.reviewed", "pr.guidance_handed", "pr.round_sent", "plan.cleared"]

[help]
target   = "a pull request URL"
summary  = "Review someone else's pull request in its own worktree"
group    = "pull requests"
examples = ["https://github.com/acme/api/pull/7", "https://github.com/acme/api/pull/7 look at the migration first"]
docs     = "guides/review"

[guidance]
help = "what the round should look at"

[headline]
resumed = "review of {{.pr.slug}}"
[[headline.new]]
when = 'turn.try'
line = "Dry-run review of {{.pr.slug}}: trying a profile, nothing is published."
[[headline.new]]
when = 'turn.stage == "follow-up"'
line = 'Follow-up review of {{.pr.slug}}, {{template "started_by" .}}.'
[[headline.new]]
line = 'First review of {{.pr.slug}}, {{template "started_by" .}}.'

[action]
primary = { when = "!row.question && !pr.mine && !pr.adopted" }
warning = "{{if .row.question}}Starts a new round; the agent's open question is replaced{{end}}"

[record]
when      = '!turn.try'
states    = ["done", "settled", "asked", "failed"]
artifacts = ["review-draft"]
outcome   = ["verdict", "url"]
outcome_doc = '''
`outcome`: on `done`, the published `verdict`, the review's `url`,
  `blocking` and `non_blocking`; on `asked` with a held draft, the `verdict`
  the draft would publish and its counts.'''
require = [
  { state = "done", fields = ["verdict", "url"] },
  { state = "asked", artifact = "review-draft", fields = ["verdict"] },
]

[resume]
changed = "Review the commits since; if they change anything the draft says, ask again (record `asked`) before publishing an approval."
