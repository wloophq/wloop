label   = "Nudge"
summary = "Ask whoever the pull request waits on for the next step, in a comment; guidance is the topic"
key     = "N"
role    = "nudge"
provider = "github"
skill = true
cap        = "rounds"
refuse_when = "pr.nudge_refusal"
workspace = "pr_else_main"
session   = { strategy = "new", title = "nudge", close_when_done = true }
answerable = false
profile   = "nudge"
brief     = { render = false, wait = false }
prepare   = "nudge.prepare"
on_sent   = ["event.nudged"]

[help]
target   = "a pull request URL"
summary  = "Ask whoever it waits on for the next step"
group    = "pull requests"
examples = ["https://github.com/acme/api/pull/7", "https://github.com/acme/api/pull/7 the release is on Friday"]
docs     = "guides/nudge"

[guidance]
help  = "what to ask about"
max   = 500

[headline]
resumed = "nudge on {{.PR.Slug}}"
[[headline.new]]
text = "Nudge on {{.PR.Slug}}, {{.Who}}."

[inputs.situation]
type    = "text"
from    = "prepare"
persist = true
hidden  = true

[inputs.waits_on_maintainers]
type    = "flag"
from    = "prepare"
persist = true
hidden  = true

[inputs.who]
type    = "list"
from    = "prepare"
persist = true
hidden  = true

[action]
enabled    = 'row.nudge.refusal == ""'
reason_off = "{{.row.nudge.refusal}}"
hint       = "Nudge {{join .row.nudge.who \", \"}}"
confirm    = "Nudge {{join .row.nudge.who \", \"}} on {{.pr.slug}}? An agent posts one comment under your name."

[record]
states  = ["done", "failed"]
outcome = ["url"]
outcome_doc = "`outcome` (done): `url`, the comment's URL."
require = [{ state = "done", fields = ["url"] }]
