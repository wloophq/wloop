label   = "Act"
summary = "Act on the open items of a unit without touching its code: settle what you can and propose the replies it needs as drafts for you to approve; Address works on the code of a pull request you develop"
verb    = "delegate"
role    = "headless"
workspace = "linked_else_main"
provider  = "any"
runners   = ["headless", "session"]
session   = { strategy = "new", title = "act", close_when_done = true }
brief     = { render = true, wait = false }

[drafts]
allowed_effects = ["task.nudged", "unit.closed"]

[help]
target   = "a pull request URL, a Slack message ref (<conversation>/<ts>) or permalink, or <provider>:<key> of a unit the intent serves"
summary  = "Resolve a unit's open items, replies as drafts"
group    = "pull requests"
examples = ["https://github.com/acme/api/pull/7", "https://acme.slack.com/archives/C0123/p1700000000000100 say we ship Friday"]
docs     = "concepts/tasks"

[guidance]
help = "what to do about the items"

[headline]
resumed = "act on {{.unit.ref}}"
[[headline.new]]
line = 'Act on the open items of {{.unit.ref}}, {{template "started_by" .}}.'

[action]
note = "Runs one read-only agent call on the selected items; replies wait in the Outbox for your approval{{if .row.recommended}} (recommended: {{.row.recommended}}){{end}}"

[[action.refuse]]
when = "!(row.yours)"
why  = "Not yours: take it over first"

[record]
states = ["done", "asked", "failed"]
missing = "missing-record"
