label   = "Probe"
summary = "Check that an agent home can read its turn, record it, take an answer and be resumed"
user_facing = false
role    = "probe"
provider = "github"
workspace = "given"
session   = { strategy = "new", title = "probe" }
reports   = false
brief     = { render = false, wait = false }

[headline]
resumed = "{{name}} probe {{.pr.slug}}"
[[headline.new]]
line = '{{name}} probe {{.pr.slug}}, {{template "started_by" .}}.'

[record]
states = ["done", "asked", "failed"]
