# The words of the gates, the decisions that wait on you. A user profile's
# gates.toml replaces the keys it sets.

# One gate per kind: the loop opens the first gate of a kind when it opens
# one by kind.

[gates.draft]
kind = "draft"
label = "Send this draft?"
# A task opened only to hold this gate ends with it: done once the draft is
# approved, in the trash once it is discarded or withdrawn.
ends_task = { approved = "done", rejected = "dropped", superseded = "dropped" }

[gates.draft.intents.approve]
label = "Approve"
status = "approved"

[gates.draft.intents.discard]
label = "Discard"
status = "rejected"

# A round, or any workflow item, that waits for you or for its window; it
# asks its workflow's ask, else its summary, and the label only without one.
[gates.plan]
kind = "plan"
label = "Run this?"
ends_task = { approved = "done", rejected = "dropped", dismissed = "dropped", superseded = "dropped" }

[gates.plan.intents.run_now]
label = "Run now"
summary = "Run what waits now, without waiting for its delay or the daily budget. Skip drops it instead."
confirm = "{{if and .row.capped (not .row.pending)}}Run the held round on {{.pr.slug}} now? It does not count against the cap.{{end}}"
status = "approved"

[gates.plan.intents.skip]
label = "Skip"
summary = "Drop what waits without running it. Run now runs it instead."
status = "rejected"

[gates.plan.intents.guide]
label = "Guide"
summary = "Tell the agent what to look at; your text goes with what waits now, or with the next run when nothing waits."
note = "{{if not .row.pending}}Kept for the next automatic round{{end}}"
status = "approved"
answer = true

[gates.question]
kind = "question"
label = "The agent asks"
closes_with = "dismiss"

[gates.question.intents.answer]
label = "Answer"
summary = "Reply to the agent's open question with your text; the agent resumes from your answer."
status = "answered"
answer = true

[gates.question.intents.continue]
label = "Continue"
summary = "Let the agent resume without an answer, deciding the open question itself. Answer gives it your reply instead."
status = "answered"

[gates.question.intents.dismiss]
label = "Dismiss"
summary = "Close the agent's open question without resuming it; the pull request goes back to whoever it waits on."
note = "Close the question; the pull request goes back to whoever it waits on"
status = "dismissed"

[gates.post]
kind = "post"
label = "The agent says"
closes_with = "dismiss"

[gates.post.intents.reply]
label = "Reply"
status = "answered"
answer = true

[gates.post.intents.dismiss]
label = "Dismiss"
status = "dismissed"

[gates.proposal]
kind = "proposal"
label = "Apply this proposal?"
text = "Proposed {{.proposal.op}} of item {{.proposal.item}} on {{.proposal.unit}}{{with .proposal.reason}}: {{.}}{{end}} (from {{.proposal.provenance}}; you confirmed the item)"

[gates.proposal.intents.approve]
label = "Approve"
status = "approved"

[gates.proposal.intents.reject]
label = "Reject"
status = "rejected"

# A merge a workflow asks for, such as an ask in a thread that links a
# pull request with a task of its own. The asking workflow's approval
# decides it: approving it by hand runs the merge as yours, a rule that
# releases it runs it as the workflow.
[gates.merge]
kind = "proposal"
label = "Merge these tasks?"
text = "Merge \"{{.proposal.fold}}\" into \"{{.proposal.keep}}\"? Its items, units, gates and drafts move over; Split gives it back."

[gates.merge.intents.approve]
label = "Merge"
status = "approved"

[gates.merge.intents.reject]
label = "Keep apart"
status = "rejected"

# A relation a workflow asks for, between two tasks of distinct but related
# work; decided as the merge gate is.
[gates.relate]
kind = "proposal"
label = "Relate these tasks?"
text = "Relate \"{{.proposal.task}}\" and \"{{.proposal.other}}\"? Each lists the other; Unrelate takes the link off."

[gates.relate.intents.approve]
label = "Relate"
status = "approved"

[gates.relate.intents.reject]
label = "Keep unrelated"
status = "rejected"

# A round whose start the agent blocked on its question, such as trusting
# its folder.
[gates.trust]
kind = "trust"
label = "The agent blocked the round's start"

[gates.trust.intents.trust_run]
label = "Trust folder and run"
summary = "Trust the folder the agent was blocked on in your agent homes, then run the round. Dismiss block lifts the block without trusting it."
note = "Trust {{.row.trust_folder}} in {{join .row.trust_homes \", \"}}, then run the round"
status = "approved"

[gates.trust.intents.unblock]
label = "Dismiss block"
summary = "Lift the block without trusting the folder; the round waits for its next trigger. Trust folder and run trusts it and runs now."
note = "Lift the block without trusting; the round waits for a new trigger"
status = "dismissed"

# The diff of a pull request a start turn opened, for you to review; its
# text reads the facts of the task and of the units it holds.
[gates.review-diff]
kind = "step"
label = "Review the diff"
text = "Review the diff{{with .pr.slug}} of {{.}}{{end}}{{with .pr.changed_files}}, {{if eq . 1}}1 file{{else}}{{.}} files{{end}} changed{{end}}"
closes_with = "dismiss"

[gates.review-diff.intents.approve]
label = "Looks good"
summary = "Mark the diff reviewed; posts nothing."
status = "approved"

[gates.review-diff.intents.dismiss]
label = "Dismiss"
summary = "Close this step without reviewing; the task stays as it is."
status = "dismissed"

# A run that failed or ended without its record, of an intent whose
# record.missing names it.
[gates.missing-record]
kind = "question"
label = "The run stopped: it failed or ended without its record"
closes_with = "dismiss"

[gates.missing-record.intents.answer]
label = "Answer"
summary = "Resume the run with your text."
status = "answered"
answer = true

[gates.missing-record.intents.continue]
label = "Continue"
summary = "Resume the run as it was, without your text."
status = "answered"

[gates.missing-record.intents.dismiss]
label = "Dismiss"
summary = "Close the stopped run without resuming it."
status = "dismissed"

# How a gate is decided when no workflow, intent or configuration says: a
# run starts at once, every other decision waits for you.
[approval]
mode = "wait"

[[approval.rule]]
when = 'gate.kind == "plan"'
mode = "run"

# What sending a draft does besides posting it, by effect: a draft's card
# says it in these words.
[effects]
"task.nudged" = "The task is marked as nudged."
"unit.closed" = "The conversation is closed and the open tasks that hold it end."

# What a draft's card and the Outbox call drafts: the group of those written by
# hand, what a draft is for, and where its delivery stands.
[drafts]
by_hand = "Written by hand"
by_hand_about = "Replies and reactions you wrote yourself, waiting to be sent."
quoted = "Quotes an item of {conversation}, a conversation they are not in."

[drafts.purposes]
nudge = "Nudge"
close = "Close"
ask_owner = "Ask who owns it"
acknowledge = "Acknowledge"
redirect = "Point elsewhere"
reply = "Reply"
react = "React"
unreact = "Remove a reaction"

[drafts.states]
held = "waiting for you"
queued = "queued"
sending = "sending"
sent = "sent"
failed = "failed to send"
dropped = "dropped"

[drafts.reasons]
assigned = "its items got an owner"
moot = "it no longer applies"
outside = "it addressed someone who cannot read that conversation"
joined = "the person it was written to joined the conversation it came from"
ended = "its task ended"
skipped = "you skipped its workflow there"
superseded = "a draft to the whole conversation replaced it"
