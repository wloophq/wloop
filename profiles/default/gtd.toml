# The words of the GTD verbs an entry offers and of the lists of entries.
# A verb's label is its button; its summary, one line on what pressing it
# does, is the button's tooltip. A user profile's gtd.toml replaces the keys
# it sets.

[verbs.next]
label   = "Next"
summary = "Move it to Next: something you will do as soon as you can."

[verbs.waiting]
label   = "Waiting"
summary = "Move it to Waiting on the people you name; it resurfaces on the date you set."

[verbs.schedule]
label   = "Schedule"
summary = "Hide it until a date or until its unit moves, then bring it back where it was."

[verbs.someday]
label   = "Someday"
summary = "Move it to Someday: not now, kept for a later look."

[verbs.reference]
label   = "Reference"
summary = "Keep it as reference: nothing to do, worth finding again."

[verbs.focus]
label   = "Focus"
summary = "Star it in Focus, or take the star off."

[verbs.project]
label   = "Project"
summary = "Attach it to a project, or start a new project with it."

[verbs.approve]
label   = "Approve"
summary = "Approve what it proposes: its draft, its recommended answer or its unit's action."

[verbs.delegate]
label   = "Delegate"
summary = "Hand it to an agent, which runs its unit's action."

[verbs.done]
label   = "Done"
summary = "Mark it done: it leaves your lists for the Logbook."

[verbs.dismiss]
label   = "Dismiss"
summary = "Throw it away: it goes to the trash, and a draft it carries is discarded."

[verbs.seen]
label   = "Seen"
summary = "Mark what changed on it as read."

[verbs.context]
label   = "Context"
summary = "Set the contexts it is listed under."

[verbs.area]
label   = "Area"
summary = "Set the area it belongs to."

[verbs.answer]
label   = "Answer"
summary = "Answer the question it asks."

[verbs.edit]
label   = "Edit"
summary = "Change its draft before it is sent."

[verbs.retry]
label   = "Retry"
summary = "Send its failed draft again."

[verbs.reviewed]
label   = "Reviewed"
summary = "Mark the project reviewed; the next review comes after its interval."

[verbs.sequential]
label   = "Sequential"
summary = "Take the project's actions one at a time, or all at once again."

[verbs.reply]
label   = "Reply"
summary = "Write a reply on its unit; it waits in the Outbox for your approval."

[views.focus]
label = "Focus"

[views.inbox]
label = "Inbox"

[views.outbox]
label = "Outbox"

[views.next]
label = "Next"

[views.waiting]
label = "Waiting"

[views.projects]
label = "Projects"

[views.someday]
label = "Someday"

[views.logbook]
label = "Logbook"

[views.review]
label = "Review"
