# The task properties and states, and the words of the verbs a task
# offers. A user profile's tasks.toml replaces the keys it sets and adds
# its own properties and states after these, in the order it writes them.

# The states a task takes, in the order clients list them. The category is
# all the loop reads of a state: a task proposed in a category takes the
# first state of it here.

[states.inbox]
category = "inbox"
label    = "Inbox"

[states.next]
category = "ready"
label    = "Next"

[states.waiting]
category = "waiting"
label    = "Waiting"

[states.scheduled]
category = "deferred"
label    = "Scheduled"

[states.someday]
category = "deferred"
label    = "Someday"

[states.done]
category = "done"
label    = "Done"

[states.reference]
category = "done"
label    = "Reference"

[states.trash]
category = "dropped"
label    = "Trash"

# The task properties, each the fact task.prop.<name>. Writers are who may
# write one: a property an agent or a plugin writes is untrusted, so no
# approval rule that releases a send or a run reads it. An int or a
# duration of 0 means unset.

[props.priority]
type    = "enum"
values  = ["low", "normal", "high"]
writers = ["person", "agent"]
doc     = "How much the task matters next to the others."

[props.due]
type    = "date"
writers = ["person", "plugin"]
doc     = "When the task is due: the date you set, or the deadline its source derives."

[props.promised]
type    = "date"
writers = ["person"]
doc     = "The date you promised the task by, such as an answer by Friday."

[props.size]
type    = "duration"
writers = ["person", "agent"]
doc     = "How much of your attention the task takes."

[props.effort]
type    = "enum"
values  = ["xs", "s", "m", "l", "xl"]
writers = ["agent"]
doc     = "How much work the agent's brief estimates for the task."

[props.risk]
type    = "enum"
values  = ["low", "medium", "high"]
writers = ["person", "agent", "plugin"]
doc     = "How much could go wrong doing the task."

[props.owner]
type    = "actor"
writers = ["person"]
doc     = "Who owns the task."

[props.asker]
type    = "actor"
writers = ["plugin", "agent"]
doc     = "Who asked for the task."

[props.kind]
type    = "enum"
values  = ["start", "capture", "project"]
writers = ["plugin", "workflow"]
doc     = "What the task is: new work, a capture, a project, or a kind a plugin gives its units' tasks, such as a pull request or a thread."

[props.area]
type    = "string"
writers = ["person"]
doc     = "The area of your life or work the task belongs to; areas seeds the menu."

[props.contexts]
type    = "string[]"
writers = ["person", "plugin"]
doc     = "The contexts the task is listed under, such as @calls or @repo-api; contexts seeds the menu."

[props.focus]
type    = "enum"
values  = ["on", "off"]
writers = ["person", "workflow"]
doc     = "Whether the task is starred in Focus."

[props.autostar]
type    = "enum"
values  = ["on"]
writers = ["workflow"]
doc     = "The task-autofocus workflow starred the task, so task-autofocus-clear may take its star off."

[props.last_nudge]
type    = "date"
writers = ["workflow"]
doc     = "When a workflow last nudged whoever the task waits on."

[props.check_on]
type    = "date"
writers = ["person", "workflow"]
doc     = "When to check on the task while it waits."

# Who owes a task's next step: an expression over the task's facts whose
# value is me, a person's key, or empty when nobody does; it is the fact
# task.owed_by. Here an open gate makes it yours; otherwise an item that
# waits on you; otherwise whoever its items wait on; otherwise its owner,
# and you when it has none.

[owed_by]
expr = '''
task.category in ["done", "dropped"] ? "" :
task.gates_open > 0 || "me" in task.link_owes ? "me" :
size(task.link_owes) > 0 ? task.link_owes[0] :
task.prop.owner != "" ? task.prop.owner : "me"'''

# The verbs. A verb's label is its button; its summary, one line on what
# pressing it does, is the button's tooltip; input is the question a verb
# that asks for a value puts first. from are the states a verb takes a
# task from (every state when left out), to the state it moves it to,
# handler what the loop runs besides the move. by says who may run it:
# a condition over the task's facts per actor (person, workflow, agent,
# plugin), or "gate", which opens the gate the verb's gate names for a
# person to approve; an actor left out may not run it.

[verbs.next]
label   = "Next"
summary = "Move it to Next: something you will do as soon as you can."
from    = ["inbox", "waiting", "scheduled", "someday", "reference"]
to      = "next"
by      = { person = "true", workflow = "true" }

[verbs.waiting]
handler = "waiting"
label   = "Waiting"
summary = "Move it to Waiting on the people you name; it resurfaces on the date you set."
input   = "Waiting on whom (optional)"
from    = ["inbox", "next", "scheduled", "someday"]
to      = "waiting"
by      = { person = "true", workflow = "true" }

[verbs.schedule]
handler = "schedule"
label   = "Schedule"
summary = "Hide it until a date or until its unit moves, then bring it back where it was."
input   = "Until when: YYYY-MM-DD, an RFC 3339 time, or activity"
from    = ["inbox", "next", "waiting", "scheduled", "someday"]
to      = "scheduled"
by      = { person = "true", workflow = "true" }

[verbs.someday]
label   = "Someday"
summary = "Move it to Someday: not now, kept for a later look."
from    = ["inbox", "next", "waiting", "scheduled"]
to      = "someday"
by      = { person = "true" }

[verbs.reference]
label   = "Reference"
summary = "Keep it as reference: nothing to do, worth finding again."
from    = ["inbox", "next", "waiting", "scheduled", "someday", "done"]
to      = "reference"
by      = { person = "true" }

[verbs.focus]
handler = "focus"
label   = "Focus"
summary = "Star it in Focus, or take the star off."
from    = ["inbox", "next", "waiting", "scheduled", "someday", "reference"]
by      = { person = "true", workflow = "true" }

[verbs.project]
handler = "project"
label   = "Project"
summary = "Attach it to a project, or start a new project with it."
input   = "Project title"
from    = ["inbox", "next", "waiting", "scheduled", "someday", "reference"]
by      = { person = "true" }

[verbs.approve]
handler = "approve"
label   = "Approve"
summary = "Approve what it proposes: its draft, its recommended answer or its unit's action."
by      = { person = "true" }

[verbs.delegate]
handler = "delegate"
label   = "Delegate"
summary = "Hand it to an agent, which runs its unit's action."
input   = "Guidance for the agent (optional)"
by      = { person = "true" }

[verbs.done]
label   = "Done"
summary = "Mark it done: it leaves your lists for the Logbook."
from    = ["inbox", "next", "waiting", "scheduled", "someday", "reference"]
to      = "done"
by      = { person = "true", workflow = "true" }

[verbs.dismiss]
label   = "Dismiss"
summary = "Throw it away: it goes to the trash, and a draft it carries is discarded."
from    = ["inbox", "next", "waiting", "scheduled", "someday", "reference", "done"]
to      = "trash"
by      = { person = "true", workflow = "true" }

[verbs.seen]
handler = "seen"
label   = "Seen"
summary = "Mark what changed on it as read."
by      = { person = "true" }

[verbs.context]
handler = "context"
label   = "Context"
summary = "Set the contexts it is listed under."
input   = "Contexts, comma separated (empty clears)"
from    = ["inbox", "next", "waiting", "scheduled", "someday", "reference"]
by      = { person = "true" }

[verbs.area]
handler = "area"
label   = "Area"
summary = "Set the area it belongs to."
input   = "Area (empty clears)"
from    = ["inbox", "next", "waiting", "scheduled", "someday", "reference"]
by      = { person = "true" }

[verbs.answer]
handler = "answer"
label   = "Answer"
summary = "Answer the question it asks."
by      = { person = "true" }

[verbs.edit]
handler = "edit"
label   = "Edit"
summary = "Change its draft before it is sent."
by      = { person = "true" }

[verbs.retry]
handler = "retry"
label   = "Retry"
summary = "Send its failed draft again."
by      = { person = "true" }

[verbs.reviewed]
handler = "reviewed"
label   = "Reviewed"
summary = "Mark the project reviewed; the next review comes after its interval."
by      = { person = "true" }

[verbs.sequential]
handler = "sequential"
label   = "Sequential"
summary = "Take the project's actions one at a time, or all at once again."
by      = { person = "true" }

[verbs.reply]
handler = "reply"
label   = "Reply"
summary = "Write a reply on its unit; Send posts it now, Save as draft holds it for your approval."
input   = "Your reply"
send    = "now"
by      = { person = "true" }

# What you write on a task's chat reaches its live session; with none, it
# starts a turn of this intent, resuming the task's last session.
[chat]
intent = "chat"
