display_information:
  name: {{name}} (Your Name)
  description: Brings the Slack threads and DMs that ask something of you into your {{name}} Inbox, and posts as you only after your approval.
oauth_config:
  redirect_urls:
    - http://127.0.0.1:53682/slack/callback
  scopes:
    user:
      - search:read
      - channels:history
      - groups:history
      - im:history
      - mpim:history
      - channels:read
      - groups:read
      - im:read
      - mpim:read
      - users:read
      - users:read.email
      - chat:write
      - im:write
      - reactions:read
      - reactions:write
      - files:read
settings:
  event_subscriptions:
    user_events:
      - message.channels
      - message.groups
      - message.im
      - message.mpim
      - reaction_added
      - reaction_removed
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: true
